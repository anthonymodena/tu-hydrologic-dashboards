<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Conservation Hydrology Dashboard</title>
<style>
    body { font-family: Arial, sans-serif; background: #121B33; margin: 0; }
    .tu-header { display:flex; align-items:center; justify-content:space-between;
                 padding: 14px 24px; border-bottom: 2px solid rgba(247,248,245,0.30); background: #121B33; }
    .tu-header-title { color: #F7F8F5; font-size: 20px; font-weight: bold; margin: 0; }
    .tu-header-logo { height: 56px; }
    .tu-selector { padding: 12px 24px; background: #121B33; border-bottom: 1px solid rgba(247,248,245,0.30);
                   display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .tu-selector input[type=text] { font-family: Arial, sans-serif; font-size: 13px; color: #F7F8F5;
                   border: 1px solid rgba(247,248,245,0.30); border-radius: 4px; padding: 7px 10px; width: 260px;
                   background: #121B33; }
    .tu-selector select { font-family: Arial, sans-serif; font-size: 13px; color: #F7F8F5;
                   border: 1px solid rgba(247,248,245,0.30); border-radius: 4px; padding: 6px; width: 260px; height: 34px;
                   background: #121B33; }
    .tu-selector-count { font-size: 12px; color: #8791B0; opacity: 0.9; }
    .tu-frame { width: 100%; height: 1100px; border: none; display: block; }
  </style>
</head>
<body>
<div class="tu-header">
  <h1 class="tu-header-title">Conservation Hydrology Dashboard</h1>
  
</div>
<div class="tu-selector">
  <input type="text" id="tu-search" placeholder="Search by site ID or watershed...">
  <select id="tu-site-select" size="1"></select>
  <span class="tu-selector-count" id="tu-selector-count"></span>
</div>
<iframe id="tu-frame" class="tu-frame" src="AP01/index.html"></iframe>
<script>
    var tuSites = [{id:'AP01',watershed:'Aptos'},{id:'AP02',watershed:'Aptos'},{id:'AP03',watershed:'Aptos'},{id:'BUC01',watershed:'Buckeye'},{id:'BUC02',watershed:'Buckeye'},{id:'BU01',watershed:'Butano'},{id:'BU02',watershed:'Butano'},{id:'APN',watershed:'Chorro'},{id:'CPN',watershed:'Chorro'},{id:'PFL',watershed:'Chorro'},{id:'DB01',watershed:'Dutch Bill'},{id:'DB02',watershed:'Dutch Bill'},{id:'DB04',watershed:'Dutch Bill'},{id:'DB05',watershed:'Dutch Bill'},{id:'DB06',watershed:'Dutch Bill'},{id:'DB07',watershed:'Dutch Bill'},{id:'GAR01',watershed:'Garcia'},{id:'GAR02',watershed:'Garcia'},{id:'MW01',watershed:'Mark West'},{id:'MW02',watershed:'Mark West'},{id:'MW10',watershed:'Mark West'},{id:'MW11',watershed:'Mark West'},{id:'MW12',watershed:'Mark West'},{id:'MW13',watershed:'Mark West'},{id:'MW14',watershed:'Mark West'},{id:'LM03',watershed:'Mill'},{id:'MI01',watershed:'Mill'},{id:'MI03',watershed:'Mill'},{id:'MI04',watershed:'Mill'},{id:'MI05',watershed:'Mill'},{id:'MI06',watershed:'Mill'},{id:'MI08',watershed:'Mill'},{id:'NA01',watershed:'Navarro'},{id:'NA02',watershed:'Navarro'},{id:'NA07',watershed:'Navarro'},{id:'NA11',watershed:'Navarro'},{id:'NA12',watershed:'Navarro'},{id:'NA13',watershed:'Navarro'},{id:'NA15',watershed:'Navarro'},{id:'NA18',watershed:'Navarro'},{id:'NA19',watershed:'Navarro'},{id:'NA20',watershed:'Navarro'},{id:'NA21',watershed:'Navarro'},{id:'NA22',watershed:'Navarro'},{id:'NA23',watershed:'Navarro'},{id:'NA24',watershed:'Navarro'},{id:'OU01',watershed:'Outlet'},{id:'OU02',watershed:'Outlet'},{id:'OU05',watershed:'Outlet'},{id:'OU06',watershed:'Outlet'},{id:'OU12',watershed:'Outlet'},{id:'OU13',watershed:'Outlet'},{id:'OU14',watershed:'Outlet'},{id:'PN01',watershed:'Pena'},{id:'PN02',watershed:'Pena'},{id:'PN03',watershed:'Pena'},{id:'PE01',watershed:'Pescadero'},{id:'PE03',watershed:'Pescadero'},{id:'PE04',watershed:'Pescadero'},{id:'PE05',watershed:'Pescadero'},{id:'SQ01',watershed:'Soquel'},{id:'SQ02',watershed:'Soquel'},{id:'SQ04',watershed:'Soquel'},{id:'TUN01',watershed:'Tunitas'}];
    var tuFirstRender = true;
    var tuSelect = document.getElementById("tu-site-select");
    var tuSearch = document.getElementById("tu-search");
    var tuCount = document.getElementById("tu-selector-count");

    function tuShowSite(id) {
      document.getElementById("tu-frame").src = id + "/index.html";
    }

    function tuRenderOptions(filter) {
      filter = (filter || "").toLowerCase();
      var groups = {};
      var matchCount = 0;
      tuSites.forEach(function (s) {
        if (filter && s.id.toLowerCase().indexOf(filter) === -1 &&
            s.watershed.toLowerCase().indexOf(filter) === -1) return;
        if (!groups[s.watershed]) groups[s.watershed] = [];
        groups[s.watershed].push(s.id);
        matchCount++;
      });
      var html = "";
      Object.keys(groups).sort().forEach(function (w) {
        html += '<optgroup label="' + w + '">';
        groups[w].sort().forEach(function (id) {
          html += '<option value="' + id + '">' + id + "</option>";
        });
        html += "</optgroup>";
      });
      tuSelect.innerHTML = html;
      tuCount.textContent = matchCount + " of " + tuSites.length + " sites";
      if (tuFirstRender && tuSelect.options.length > 0) {
        tuSelect.selectedIndex = 0;
        tuShowSite(tuSelect.value);
        tuFirstRender = false;
      }
    }

    tuSearch.addEventListener("input", function () { tuRenderOptions(tuSearch.value); });
    tuSelect.addEventListener("change", function () { tuShowSite(tuSelect.value); });
    tuRenderOptions("");
  </script>
</body>
</html>
